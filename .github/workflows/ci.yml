name: CI Catalogo MVC

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    name: Verificar sintaxis PHP
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Validar sintaxis de los archivos PHP
        shell: bash
        run: |
          find app config public -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
          php -l index.php
